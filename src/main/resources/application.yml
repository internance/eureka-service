spring:
  application:
    name: eureka-service
  profiles:
    default: local
  cloud:
    discovery:
      client:
        health-indicator:
          enabled: true

server:
  port: ${SERVER_PORT:8761}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
